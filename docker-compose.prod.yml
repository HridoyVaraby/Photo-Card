version: '3.8'

services:
  photo-card-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: photo-card-generator-prod
    ports:
      - "80:80"
    restart: always
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - photo-card-network

networks:
  photo-card-network:
    driver: bridge