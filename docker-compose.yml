version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: news-photo-card-generator:latest
    container_name: news-photo-card-app
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production

volumes:
  # Optional: If you need persistent logs or data
  # nginx-logs:
  #   driver: local
