# Traefik configuration for production deployment
api:
  dashboard: true
  insecure: true

providers:
  docker:
    exposedByDefault: false
    network: photo-card_photo-card-network

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: "websecure"
          scheme: "https"
          permanent: true

  websecure:
    address: ":443"
    http:
      middlewares:
        - "photo-card-headers@docker"

      tls:
        certResolver: "letsencrypt"

certificatesResolvers:
  letsencrypt:
    acme:
      email: "admin@yourdomain.com"
      storage: "/letsencrypt/acme.json"
      httpChallenge:
        entryPoint: "web"

log:
  level: "INFO"

accessLog: {}