version: '3.8'

services:
  photo-card-app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: photo-card-generator-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    networks:
      - photo-card-dev-network

networks:
  photo-card-dev-network:
    driver: bridge